---
# Github Actions build of downloadable rclone packages for this fork.
# -*- compile-command: "yamllint -f parsable build-packages.yml" -*-
#
# Why this exists: the upstream .github/workflows/build.yml is test-only on a
# fork.  Its "Deploy built binaries" step is gated on
# `github.repository == 'rclone/rclone'`, and none of its steps call
# actions/upload-artifact, so on a fork it can never produce anything you can
# download.  This workflow only builds and publishes packages.
#
# Version string: a tag push such as v1.76.0-115 is used verbatim, otherwise
# the fork gets an upstream style beta string, e.g. v1.76.0-beta.1234.d8af2b20.
#
# Trigger it by hand from the Actions tab for artifacts, or push a v* tag to
# also get a GitHub Release with the same files attached.
#
# Every target is built with the pure Go FUSE implementations where it can be,
# which is what decides whether `rclone mount` exists in the binary:
#
#   linux    rclone mount and rclone mount2 with no build tag and no cgo
#            (bazil.org/fuse and github.com/hanwen/go-fuse are both pure Go).
#   windows  rclone mount comes from cmount/cgofuse, so windows-amd64 is built
#            with -tags cmount.  cgofuse has a pure Go Windows backend, so
#            CGO_ENABLED=0 is enough - no MinGW toolchain and no WinFsp SDK.
#            WinFsp is a kernel driver that rclone loads from the user's machine
#            at run time, so users still have to install it themselves.
#   darwin   cmount is gated on `cmount && darwin && cgo`, so macOS needs a
#            macOS runner, CGO_ENABLED=1 and the macFUSE headers, plus the tag.
#            macos-latest is arm64, so darwin-amd64 is also a cross build with
#            -arch x86_64.  cgofuse dlopens libfuse at run time rather than
#            linking it, so nothing is linked against macFUSE here and users
#            still have to install it to mount.  See
#            docs/content/commands/rclone_mount.md.

name: build-packages

on:
  # Manual run from the Actions tab: artifacts only, no release.
  workflow_dispatch:
  # Tag push, e.g. v1.76.0-115: artifacts plus a GitHub Release.
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A tag push is occasionally delivered twice by GitHub (seen with
# v1.76.0-115.2: two runs a second apart, and the second one failed because the
# first had already created the release), and re-running a job keeps the same
# ref.  Serialise per ref and let the newer run win so a duplicate does not
# build everything a second time.  The release step is idempotent as well, so
# whichever run gets there last still leaves a complete release behind.
concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pure Go, CGO_ENABLED=0.
          - {name: linux-amd64,   os: ubuntu-latest, goos: linux,   goarch: amd64, ext: ''}
          - {name: linux-arm64,   os: ubuntu-latest, goos: linux,   goarch: arm64, ext: ''}
          - {name: linux-armv7,   os: ubuntu-latest, goos: linux,   goarch: arm,   goarm: '7', ext: ''}
          # cgofuse has a pure Go Windows backend, so only the tag is needed.
          - {name: windows-amd64, os: ubuntu-latest, goos: windows, goarch: amd64, gotags: cmount, ext: '.exe'}
          # cgo, on a macOS runner: cmount on darwin requires it.
          - {name: darwin-amd64,  os: macos-latest,  goos: darwin,  goarch: amd64, cgo: '1', carch: x86_64, gotags: cmount, ext: ''}
          - {name: darwin-arm64,  os: macos-latest,  goos: darwin,  goarch: arm64, cgo: '1', carch: arm64,  gotags: cmount, ext: ''}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the beta version string can count commits and
          # resolve the short hash.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          # go.mod is the single source of truth for the Go version.
          go-version-file: go.mod

      - name: Install macFUSE
        if: matrix.goos == 'darwin'
        run: |
          # cmount compiles against the FUSE headers on macOS.  Only the headers
          # are needed to build: cgofuse dlopens libfuse at run time and the
          # kernel extension is only used on the machine that mounts something.
          unset HOMEBREW_NO_INSTALL_FROM_API
          brew untap --force homebrew/core || true
          brew untap --force homebrew/cask || true
          brew update
          brew install --cask macfuse
          echo "runner arch: $(uname -m)"
          # Fail here with a readable message rather than deep inside the
          # compiler if the headers did not land where the cgofuse #cgo CFLAGS
          # look for them (-I/usr/local/include/fuse and
          # -I/usr/local/include/osxfuse/fuse).
          for header in /usr/local/include/fuse/fuse.h /usr/local/include/osxfuse/fuse/fuse.h; do
            if [[ -f "${header}" ]]; then
              echo "macFUSE headers: ${header}"
              exit 0
            fi
          done
          echo "::error::no macFUSE headers found"
          find /usr/local/include -name 'fuse.h' 2>/dev/null | head
          exit 1

      - name: Work out the version string
        id: version
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(cat VERSION)-beta.$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building ${version} for ${GOOS}/${GOARCH}"

      - name: Build
        env:
          # windows-amd64 uses cgofuse's pure Go backend, so it stays at 0;
          # darwin needs real cgo for cmount (see the matrix).
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOTAGS: ${{ matrix.gotags }}
          CARCH: ${{ matrix.carch }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # An icon and version metadata are embedded in the Windows
          # executable via a resource .syso.  go build picks up
          # resource_windows_<GOARCH>.syso automatically, so it has to live in
          # the package directory (the repository root) and be cleaned up after.
          #
          # GOOS/GOARCH above are for the cross-compile, but this generator has
          # to run on the runner itself.  Drop them for this one command, or
          # go run builds a Windows executable and then cannot start it on the
          # Linux runner ("exec format error").  The target architecture is
          # passed explicitly with -arch instead.
          if [[ "${GOOS}" == "windows" ]]; then
            env -u GOOS -u GOARCH -u GOARM \
              go run bin/resource_windows.go -version "${VERSION}" -arch "${GOARCH}" \
                -syso "resource_windows_${GOARCH}.syso"
          fi
          # macOS: tell clang which slice to emit.  macos-latest is arm64, so
          # darwin-amd64 is a cross build even though the host is macOS.
          # /usr/local is where macFUSE installs its headers, which is what the
          # cgofuse #cgo CFLAGS expect and what upstream passes too.
          if [[ -n "${CARCH}" ]]; then
            export CGO_CFLAGS="-I/usr/local/include -arch ${CARCH}"
            export CGO_LDFLAGS="-L/usr/local/lib -arch ${CARCH}"
          fi
          # Keep the tags as an array so a target without tags does not get a
          # stray empty -tags argument.
          tags=()
          if [[ -n "${GOTAGS}" ]]; then
            tags=(-tags "${GOTAGS}")
          fi
          go build -v "${tags[@]}" \
            -ldflags "-s -w -X github.com/rclone/rclone/fs.Version=${VERSION}" \
            -o "rclone${EXT}" .
          rm -f resource_windows_*.syso

      - name: Smoke test the binary
        run: |
          ./rclone${{ matrix.ext }} version
        # Native runners only: linux-amd64 on ubuntu, darwin-arm64 on the arm64
        # macOS runner.  The others are cross builds and cannot be executed.
        if: matrix.name == 'linux-amd64' || matrix.name == 'darwin-arm64'

      - name: Check that mount support really made it in
        env:
          NAME: ${{ matrix.name }}
          EXT: ${{ matrix.ext }}
          GOTAGS: ${{ matrix.gotags }}
        run: |
          # `rclone mount` comes from cmount/cgofuse on Windows and macOS.
          # cmount also builds to an empty stub when its constraints are not
          # met, so the build can succeed while shipping no mount command at
          # all.  Assert on the linked dependency instead of trusting that the
          # tag did something: go version -m reads the build settings out of a
          # binary for any platform, and cgofuse is a cgo package so it can
          # only be linked when the real implementation was compiled.
          if [[ "${GOTAGS}" == *cmount* ]]; then
            if ! go version -m "rclone${EXT}" | grep -q 'winfsp/cgofuse'; then
              echo "::error::cgofuse is not linked, so this build has no 'rclone mount'"
              exit 1
            fi
            go version -m "rclone${EXT}" | grep -E '^\s+build\s+(-tags=|CGO_ENABLED=)'
          fi

      - name: Package
        env:
          EXT: ${{ matrix.ext }}
          NAME: ${{ matrix.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="rclone-${VERSION}-${NAME}"
          mkdir -p "dist/${dir}"
          mv "rclone${EXT}" "dist/${dir}/"
          # Ship the docs alongside the binary, as the upstream release zips do.
          cp README.md MANUAL.md MANUAL.txt rclone.1 "dist/${dir}/"
          (cd dist && zip -r "../${dir}.zip" "${dir}")
          ls -l "${dir}.zip"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: rclone-*-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: build
    # Only a tag push publishes a release; manual runs just keep the artifacts.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release and upload its assets.
      contents: write

    steps:
      - name: Collect the packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          # The automatically provided workflow token; no extra secret needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent on purpose: `gh release create` exits 422
          # "already_exists" when the tag already has a release, which happens
          # for a duplicated push event and for any re-run of a failed job.
          # Update the assets instead of failing in those cases.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${TAG} already has a release; refreshing its assets"
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
              dist/*.zip dist/SHA256SUMS
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --generate-notes \
              dist/*.zip dist/SHA256SUMS
          fi
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,isPrerelease,assets
